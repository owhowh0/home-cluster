apiVersion: v1
kind: Service
metadata:
  name: k8s-api
  namespace: default
spec:
  type: ExternalName
  externalName: 100.96.128.9
  ports:
  - port: 6443
    targetPort: 6443
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-api-proxy
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
  - host: k8s-api.home.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-api
            port:
              number: 6443
