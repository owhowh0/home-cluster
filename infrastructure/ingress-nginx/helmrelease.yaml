apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.x.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      extraArgs:
        enable-ssl-passthrough: ""
      service:
        type: ClusterIP
      nodeSelector:
        kubernetes.io/hostname: acer-8gb
      config:
        use-forwarded-headers: "true"
        # Optional: Add any default whitelists here if desired
